services:

  app:
    image: observability-lab/app:1.0.0
    build:
      context: ./app
    container_name: observability-app
    ports:
      - "5000:5000"

  synthetic-monitor:
    image: observability-lab/synthetic-monitor:1.0.0
    build:
      context: ./synthetic-monitor
    container_name: synthetic-monitor
    ports:
      - "8000:8000"
    depends_on:
      - app

  prometheus:
    image: prom/prometheus:v3.16.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
    depends_on:
      - app

  grafana:
    image: grafana/grafana:13.2.0
    container_name: grafana
    ports:
      - "3000:3000"

    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards

    depends_on:
      - prometheus

  alertmanager:
    image: prom/alertmanager:v0.35.1
    container_name: alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    depends_on:
      - prometheus

volumes:
  grafana-storage: