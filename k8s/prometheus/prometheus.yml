# Prometheus config for Kubernetes.
#
# Unlike the docker-compose config (static "app:5000"), targets are discovered per pod via the
# Kubernetes API. Scraping a Service would hit a random replica on every scrape and make counters
# jump between pods; scraping each pod gives one correct series per replica.
# Job names match the compose setup, so alert rules and the Grafana dashboard work unchanged.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:

  - job_name: "observability-app"
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          own_namespace: true
        selectors:
          - role: pod
            label: "app.kubernetes.io/name=app"
    relabel_configs: &pod_relabel
      # Only the named container port, and only pods that are running.
      - source_labels: [__meta_kubernetes_pod_container_port_name]
        regex: http|metrics
        action: keep
      - source_labels: [__meta_kubernetes_pod_phase]
        regex: Running
        action: keep
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_pod_node_name]
        target_label: node

  - job_name: "synthetic-monitor"
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          own_namespace: true
        selectors:
          - role: pod
            label: "app.kubernetes.io/name=synthetic-monitor"
    relabel_configs: *pod_relabel

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
