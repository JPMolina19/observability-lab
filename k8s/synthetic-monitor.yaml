apiVersion: apps/v1
kind: Deployment
metadata:
  name: synthetic-monitor
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: synthetic-monitor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: synthetic-monitor
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: synthetic-monitor
          image: observability-lab/synthetic-monitor:1.0.0
          imagePullPolicy: IfNotPresent
          env:
            # Probes the app through its Service, like a real user would (load-balanced across pods).
            - name: TARGET_URL
              value: http://app:5000
          ports:
            - name: metrics
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
            limits:
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
