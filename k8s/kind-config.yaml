# Local cluster for the lab:  kind create cluster --config k8s/kind-config.yaml
# Maps the NodePort services to the same localhost ports docker-compose uses
# (stop docker-compose first, or the ports will clash).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: observability-lab
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30300   # Grafana
        hostPort: 3000
      - containerPort: 30090   # Prometheus
        hostPort: 9090
      - containerPort: 30093   # Alertmanager
        hostPort: 9093
      - containerPort: 30500   # App
        hostPort: 5000
